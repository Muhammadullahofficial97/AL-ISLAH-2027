name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q "$(ls *.zip | head -n 1)" -d proj
          SET=$(find proj -name "settings.gradle*" | head -n 1)
          echo "ROOT=$(dirname "$SET")" >> $GITHUB_ENV
      - name: Set app name
        run: |
          S=$(find proj -path "*res/values/strings.xml" | head -n 1)
          if grep -q 'name="app_name"' "$S"; then
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">AL ISLAH</string>|' "$S"
          else
            sed -i 's|</resources>|    <string name="app_name">AL ISLAH</string>\n</resources>|' "$S"
          fi
          M=$(find proj -name AndroidManifest.xml | head -n 1)
          sed -i 's|android:label="[^"]*"|android:label="@string/app_name"|g' "$M"
          grep -n "app_name" "$S" "$M"
      - name: Build
        run: |
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AL-ISLAH-APK
          path: proj/**/build/outputs/apk/**/*.apk
