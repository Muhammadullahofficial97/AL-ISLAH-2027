name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q "$(ls *.zip | head -n 1)" -d proj
          SET=$(find proj -name "settings.gradle*" | head -n 1)
          echo "ROOT=$(dirname "$SET")" >> $GITHUB_ENV
      - name: Build
        run: |
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Madrasa-Magazine-APK
          path: proj/**/build/outputs/apk/**/*.apk
