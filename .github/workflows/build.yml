name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q "$(ls *.zip | head -n 1)" -d proj
          SET=$(find proj -name "settings.gradle*" | head -n 1)
          echo "ROOT=$(dirname "$SET")" >> $GITHUB_ENV
      - name: Set app name
        run: |
          S=$(find proj -path "*res/values/strings.xml" | head -n 1)
          if grep -q 'name="app_name"' "$S"; then
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">AL ISLAH</string>|' "$S"
          else
            sed -i 's|</resources>|    <string name="app_name">AL ISLAH</string>\n</resources>|' "$S"
          fi
          M=$(find proj -name AndroidManifest.xml | head -n 1)
          sed -i 's|android:label="[^"]*"|android:label="@string/app_name"|g' "$M"
          grep -n "app_name" "$S" "$M"
      - name: Embed fonts
        run: |
          cat > embed_gfonts.py <<'EOF'
          import re, sys, base64, urllib.request
          path = sys.argv[1]
          UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              return urllib.request.urlopen(req, timeout=60).read()
          html = open(path, encoding="utf-8").read()
          m = re.search(r'href="(https://fonts\.googleapis\.com/css2[^"]+)"', html)
          if not m:
              sys.exit("Google Fonts link not found")
          css = get(m.group(1).replace("&amp;", "&")).decode("utf-8")
          count = 0
          def repl(mm):
              global count
              data = base64.b64encode(get(mm.group(1))).decode()
              count += 1
              return "url(data:font/woff2;base64,%s)" % data
          css = re.sub(r'url\((https://fonts\.gstatic\.com/[^)]+)\)', repl, css)
          if count == 0:
              sys.exit("No font files embedded")
          html = re.sub(r'<link[^>]*fonts\.(?:googleapis|gstatic)\.com[^>]*>', '', html)
          html = html.replace("</head>", "<style>" + css + "</style></head>", 1)
          open(path, "w", encoding="utf-8").write(html)
          print("embedded font files:", count)
          EOF
          python3 embed_gfonts.py "$(find proj -path '*assets/index.html' | head -n 1)"
      - name: Build
        run: |
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AL-ISLAH-APK
          path: proj/**/build/outputs/apk/**/*.apk
